<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>VL Support Console</title><link rel="icon" href="vl-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="admin.css"></head><body>
<div id="loginView" class="screen"><div class="auth-card"><div class="logo">VL</div><p class="eyebrow">PRIVATE SUPPORT CONSOLE</p><h1>Support Desk</h1><p>Authorized staff only.</p><form id="loginForm"><input id="email" type="email" placeholder="Admin email" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Sign in securely</button><p id="loginError" class="error"></p></form></div></div>
<div id="appView" hidden><header class="topbar"><div><span class="logo small">VL</span><strong>Support Console</strong></div><div><span id="agentEmail"></span><a class="ghost" href="dashboard.html">Control Center</a><a class="ghost" href="admin.html">Invoice</a><button id="signOut" class="ghost">Sign out</button></div></header><main class="console"><aside class="inbox"><div class="inbox-head"><div><span class="eyebrow">LIVE INBOX</span><h2>Conversations</h2></div><button id="refresh" class="ghost">↻</button></div><div id="conversationList" class="conversation-list"></div></aside><section class="thread"><div id="emptyThread" class="empty"><div class="logo">VL</div><h2>Select a conversation</h2><p>Incoming live-chat messages appear here.</p></div><div id="activeThread" hidden><div class="thread-head"><div><span class="eyebrow">CONVERSATION</span><h2 id="threadTitle">Visitor</h2><p id="threadMeta"></p></div><select id="statusSelect"><option value="open">Open</option><option value="pending">Pending</option><option value="closed">Closed</option></select></div><div id="threadMessages" class="thread-messages"></div><form id="replyForm" class="reply"><textarea id="replyInput" placeholder="Write a reply…" required></textarea><button>Send reply</button></form></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
